name: Docker

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: kurotamastr/tutabridge

jobs:
  test:
    # Same checks as ci.yml's linux-cli job: the image only ships the CLI.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with official SDK submodule)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Prepare and verify patched SDK
        run: |
          if [ -f scripts/sdk-prepare.py ]; then
            python3 scripts/sdk-prepare.py
          else
            scripts/sdk-generate.sh --check
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake nasm libdbus-1-dev pkg-config

      - name: Test core and the SDK extensions
        run: cargo test --locked -p tutabridge-core -p tutabridge-tuta

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with official SDK submodule)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Prepare and verify patched SDK
        run: |
          if [ -f scripts/sdk-prepare.py ]; then
            python3 scripts/sdk-prepare.py
          else
            scripts/sdk-generate.sh --check
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
